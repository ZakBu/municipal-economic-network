name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    name: checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.12.14
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Workspace integrity
        run: uv run python scripts/check_workspace.py
      - name: Tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Formatting
        run: uv run ruff format --check .
