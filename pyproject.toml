[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "municipal-economic-network"
version = "0.1.0"
description = "Shared hackathon workspace for municipal economic network research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = [".agents", "_bmad", "_bmad-output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
